# PitchPulse — AppSync GraphQL schema
#
# Real-time multiplayer pipeline. Mutations are the broadcast points; matching
# subscriptions fan out via @aws_subscribe over pure WebSockets (Amplify SDK
# default).
#
# Auth:
#   @aws_lambda — clients. lambda/authorizer verifies a Cognito ID token; every
#                 handler acts as that verified caller, so client inputs carry
#                 no userId. startMatch/resetMatch are denied to non-operators.
#   @aws_iam    — server Lambdas only (execution roles with per-field grants).
#                 Fields marked only @aws_iam are server-only broadcasts.

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ─── Match clock + events (Pillar 2: real-time data) ─────────────────────────

type MatchClock @aws_iam @aws_lambda {
  matchId: ID!
  matchMinute: Float!
  displayClock: String!
  phase: String!
  scoreHome: Int!
  scoreGuest: Int!
  isRunning: Boolean!
  updatedAt: AWSTimestamp!
}

type MatchEvent @aws_iam @aws_lambda {
  matchId: ID!
  seq: Int!
  id: ID!
  type: String!
  matchMinute: Float!
  displayMinute: String!
  matchPhase: String!
  teamId: String
  playerId: String
  assistPlayerId: String
  cardColor: String
  reason: String
  scoreHome: Int
  scoreGuest: Int
  eventTimeIso: String
}

# ─── Watch room reactions (Pillar 1: multiplayer) ────────────────────────────

type RoomReaction @aws_iam @aws_lambda {
  roomId: ID!
  reactionId: ID!
  userId: ID!
  emoji: String!
  ts: AWSTimestamp!
}

# ─── Vote + prompt broadcast (gamification persistence — Tier B in Gate 4) ───

type Vote @aws_iam @aws_lambda {
  matchId: ID!
  promptId: ID!
  userId: ID!
  optionId: String!
  hotTake: Boolean
  votedAt: AWSTimestamp!
}

type HotTakeSignal @aws_iam @aws_lambda {
  matchId: ID!
  promptId: ID!
  userId: ID!
  rivalUserId: ID!
  ts: AWSTimestamp!
}

# ─── Watch Room (private friend-group matchday) ──────────────────────────────

enum RoomStatus {
  WAITING
  ACTIVE
  ENDED
}

type RoomMember @aws_iam @aws_lambda {
  userId: ID!
  displayName: String!
  joinedAt: AWSTimestamp!
}

type CreateRoomResult @aws_iam @aws_lambda {
  roomId: ID!
  inviteCode: String!
  roomName: String!
  matchId: ID!
  hostUserId: ID!
  status: RoomStatus!
  createdAt: AWSTimestamp!
}

type JoinRoomResult @aws_iam @aws_lambda {
  roomId: ID!
  inviteCode: String!
  roomName: String!
  matchId: ID!
  status: RoomStatus!
  members: [RoomMember!]!
  joinedMember: RoomMember!
}

type RoomComment @aws_iam @aws_lambda {
  roomId: ID!
  commentId: ID!
  promptId: ID!
  userId: ID!
  text: String!
  ts: AWSTimestamp!
}

type RoomLeaderboardEntry @aws_iam @aws_lambda {
  userId: ID!
  displayName: String!
  coins: Int!
}

type RoomLeaderboardUpdate @aws_iam @aws_lambda {
  roomId: ID!
  entries: [RoomLeaderboardEntry!]!
  updatedAt: AWSTimestamp!
}

# ─── Ranked mode + Titles (tier progression, lifetime accuracy) ──────────────

enum Tier {
  BRONZE
  SILVER
  GOLD
  DIAMOND
  CHAMPION
}

type Title @aws_iam @aws_lambda {
  id: ID!
  name: String!
  description: String!
}

type RankedOpponent @aws_iam @aws_lambda {
  opponentId: ID!
  opponentName: String!
  opponentTier: Tier!
  opponentTitle: String
}

enum RankedMatchOutcome {
  DRAW
}

type RankedMatchResult @aws_iam @aws_lambda {
  matchId: ID!
  winnerId: ID!
  loserId: ID!
  winnerTier: Tier!
  winnerTierWins: Int!
  promoted: Boolean!
  newTier: Tier
  """True when match points were equal; tier wins unchanged for both players."""
  isDraw: Boolean!
  """Set to DRAW when isDraw; win/lose per user derived from winnerId vs userId."""
  outcome: RankedMatchOutcome
}

type TierPromotedEvent @aws_iam @aws_lambda {
  userId: ID!
  previousTier: Tier!
  newTier: Tier!
  ts: AWSTimestamp!
}

type TitleUnlockedEvent @aws_iam @aws_lambda {
  userId: ID!
  titleId: ID!
  titleName: String!
  ts: AWSTimestamp!
}

# ─── Inputs ──────────────────────────────────────────────────────────────────

input MatchClockInput {
  matchId: ID!
  matchMinute: Float!
  displayClock: String!
  phase: String!
  scoreHome: Int!
  scoreGuest: Int!
  isRunning: Boolean!
  updatedAt: AWSTimestamp!
}

input MatchEventInput {
  matchId: ID!
  seq: Int!
  id: ID!
  type: String!
  matchMinute: Float!
  displayMinute: String!
  matchPhase: String!
  teamId: String
  playerId: String
  assistPlayerId: String
  cardColor: String
  reason: String
  scoreHome: Int
  scoreGuest: Int
  eventTimeIso: String
}

input FireReactionInput {
  roomId: ID!
  emoji: String!
}

input SubmitVoteInput {
  matchId: ID!
  promptId: ID!
  optionId: String!
  hotTake: Boolean
  rankedMode: Boolean
}

input SignalHotTakeInput {
  matchId: ID!
  promptId: ID!
  rivalUserId: ID!
}

input StartMatchInput {
  matchId: ID!
}

input CreateRoomInput {
  matchId: ID!
}

input JoinRoomInput {
  inviteCode: String!
}

input PostCommentInput {
  roomId: ID!
  promptId: ID!
  text: String!
}

input LeaveRoomInput {
  roomId: ID!
}

input RoomLeaderboardUpdateInput {
  roomId: ID!
  entries: [RoomLeaderboardEntryInput!]!
  updatedAt: AWSTimestamp!
}

input RoomLeaderboardEntryInput {
  userId: ID!
  displayName: String!
  coins: Int!
}

type StartMatchResult @aws_iam @aws_lambda {
  matchId: ID!
  startedAtWallMs: AWSTimestamp!
  isRunning: Boolean!
}

# ─── Ranked matchday commitment (Gate E) ─────────────────────────────────────

type RankedMatchdayStatus @aws_iam @aws_lambda {
  matchdayId: ID!
  lockedFixtureId: ID
  lockedFixtureLabel: String
  played: Boolean!
  matchPoints: Int
}

input LockInRankedInput {
  matchdayId: ID!
  fixtureId: ID!
  fixtureLabel: String!
}

# ─── Queries (minimal — used to bootstrap a late-joining client) ─────────────

enum LeaderboardPeriod {
  WEEKLY
  SEASONAL
}

type LeaderboardEntry @aws_iam @aws_lambda {
  rank: Int!
  userId: ID!
  displayName: String!
  equippedTitle: String
  tier: Tier!
  points: Int!
}

type LeaderboardUpdate @aws_iam @aws_lambda {
  period: LeaderboardPeriod!
  seasonNumber: Int
  isoWeek: String
  updatedAt: AWSTimestamp!
}

type UserStats @aws_iam @aws_lambda {
  userId: ID!
  weeklyPoints: Int!
  weeklyRank: Int
  seasonalPoints: Int!
  seasonalRank: Int
  seasonNumber: Int!
  seasonEndsAt: String
  weeklyPointsResetAt: String
  tier: Tier!
  equippedTitleId: String
  equippedTitle: String
  unlockedTitles: [String!]
  tierWinsTowardNext: Int
  lifetimeAccuracy: Float
  rankedMatchesPlayed: Int
}

input LeaderboardUpdatedInput {
  period: LeaderboardPeriod!
  seasonNumber: Int
  isoWeek: String
  updatedAt: AWSTimestamp!
}

type Query {
  ping: String @aws_iam @aws_lambda
  weeklyLeaderboard(limit: Int): [LeaderboardEntry!]! @aws_iam @aws_lambda
  seasonalLeaderboard(seasonNumber: Int, limit: Int): [LeaderboardEntry!]! @aws_iam @aws_lambda
  # Public profile stats — any signed-in user may read anyone's.
  userStats(userId: String!): UserStats @aws_iam @aws_lambda
  # The caller's own ranked matchday status.
  rankedMatchdayStatus(matchdayId: ID!): RankedMatchdayStatus @aws_lambda
}

# ─── Mutations ───────────────────────────────────────────────────────────────

type Mutation {
  # Operator-only (authorizer deniedFields + start-match handler check)
  startMatch(input: StartMatchInput!): StartMatchResult @aws_lambda
  resetMatch(input: StartMatchInput!): StartMatchResult @aws_lambda

  # Watch Room — client-callable, acting as the verified caller
  fireReaction(input: FireReactionInput!): RoomReaction @aws_lambda
  createRoom(input: CreateRoomInput!): CreateRoomResult @aws_lambda
  joinRoom(input: JoinRoomInput!): JoinRoomResult @aws_lambda
  postComment(input: PostCommentInput!): RoomComment @aws_lambda
  leaveRoom(input: LeaveRoomInput!): Boolean @aws_lambda

  # Votes + Hot Take — client-callable, acting as the verified caller
  submitVote(input: SubmitVoteInput!): Vote @aws_lambda
  signalHotTake(input: SignalHotTakeInput!): HotTakeSignal @aws_lambda
  initRankedHotTake(matchId: ID!): Boolean @aws_lambda

  # Ranked + Titles — client-callable, acting as the verified caller
  findRankedMatch: RankedOpponent @aws_lambda
  lockInRankedMatch(input: LockInRankedInput!): RankedMatchdayStatus @aws_lambda
  equipTitle(titleId: String!): Boolean @aws_lambda
  unlockHotTakeHero: Boolean @aws_lambda
  # Interim: caller must be winnerId or loserId. Moves server-side in H1 phase P4.
  completeRankedMatch(
    matchId: ID!
    winnerId: ID!
    loserId: ID!
    winnerMatchPoints: Int!
    loserMatchPoints: Int!
    winnerShotsInMatch: Int
    winnerCorrectInMatch: Int
    loserShotsInMatch: Int
    loserCorrectInMatch: Int
    winnerPointsAtHalfTime: Int
    loserPointsAtHalfTime: Int
  ): RankedMatchResult @aws_lambda

  # Server-only broadcasts (IAM: stream-handler / ranked-handler roles)
  publishMatchClock(input: MatchClockInput!): MatchClock @aws_iam
  publishMatchEvent(input: MatchEventInput!): MatchEvent @aws_iam
  publishRoomLeaderboard(input: RoomLeaderboardUpdateInput!): RoomLeaderboardUpdate @aws_iam
  notifyTierPromoted(userId: ID!, previousTier: Tier!, newTier: Tier!, ts: AWSTimestamp!): TierPromotedEvent @aws_iam
  notifyTitleUnlocked(userId: ID!, titleId: ID!, titleName: String!, ts: AWSTimestamp!): TitleUnlockedEvent @aws_iam
  publishLeaderboardUpdated(input: LeaderboardUpdatedInput!): LeaderboardUpdate @aws_iam
}

# ─── Subscriptions ───────────────────────────────────────────────────────────

type Subscription @aws_lambda {
  matchClock(matchId: ID!): MatchClock
    @aws_subscribe(mutations: ["publishMatchClock"])

  matchEvent(matchId: ID!): MatchEvent
    @aws_subscribe(mutations: ["publishMatchEvent"])

  roomReaction(roomId: ID!): RoomReaction
    @aws_subscribe(mutations: ["fireReaction"])

  voteSubmitted(matchId: ID!): Vote
    @aws_subscribe(mutations: ["submitVote"])

  roomMemberJoined(roomId: ID!): JoinRoomResult
    @aws_subscribe(mutations: ["joinRoom"])

  roomComment(promptId: ID!, roomId: ID!): RoomComment
    @aws_subscribe(mutations: ["postComment"])

  roomLeaderboardUpdate(roomId: ID!): RoomLeaderboardUpdate
    @aws_subscribe(mutations: ["publishRoomLeaderboard"])

  tierPromoted(userId: ID!): TierPromotedEvent
    @aws_subscribe(mutations: ["notifyTierPromoted"])

  titleUnlocked(userId: ID!): TitleUnlockedEvent
    @aws_subscribe(mutations: ["notifyTitleUnlocked"])

  rivalHotTakeSignal(rivalUserId: ID!): HotTakeSignal
    @aws_subscribe(mutations: ["signalHotTake"])

  leaderboardUpdated(period: LeaderboardPeriod!): LeaderboardUpdate
    @aws_subscribe(mutations: ["publishLeaderboardUpdated"])
}
