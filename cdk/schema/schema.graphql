# PitchPulse — AppSync GraphQL schema
#
# Real-time multiplayer pipeline. Mutations are the broadcast points; matching
# subscriptions fan out via @aws_subscribe over pure WebSockets (Amplify SDK
# default). Auth: IAM via Cognito Identity Pool (unauthenticated role) for the
# client; server-side Lambdas use their execution role's IAM credentials.

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ─── Match clock + events (Pillar 2: real-time data) ─────────────────────────

type MatchClock @aws_iam {
  matchId: ID!
  matchMinute: Float!
  displayClock: String!
  phase: String!
  scoreHome: Int!
  scoreGuest: Int!
  isRunning: Boolean!
  updatedAt: AWSTimestamp!
}

type MatchEvent @aws_iam {
  matchId: ID!
  seq: Int!
  id: ID!
  type: String!
  matchMinute: Float!
  displayMinute: String!
  matchPhase: String!
  teamId: String
  playerId: String
  assistPlayerId: String
  cardColor: String
  reason: String
  scoreHome: Int
  scoreGuest: Int
  eventTimeIso: String
}

# ─── Watch room reactions (Pillar 1: multiplayer) ────────────────────────────

type RoomReaction @aws_iam {
  roomId: ID!
  reactionId: ID!
  userId: ID!
  emoji: String!
  ts: AWSTimestamp!
}

# ─── Vote + prompt broadcast (gamification persistence — Tier B in Gate 4) ───

type Vote @aws_iam {
  matchId: ID!
  promptId: ID!
  userId: ID!
  optionId: String!
  hotTake: Boolean
  votedAt: AWSTimestamp!
}

type HotTakeSignal @aws_iam {
  matchId: ID!
  promptId: ID!
  userId: ID!
  rivalUserId: ID!
  ts: AWSTimestamp!
}

# ─── Watch Room (private friend-group matchday) ──────────────────────────────

enum RoomStatus {
  WAITING
  ACTIVE
  ENDED
}

type RoomMember @aws_iam {
  userId: ID!
  displayName: String!
  joinedAt: AWSTimestamp!
}

type CreateRoomResult @aws_iam {
  roomId: ID!
  inviteCode: String!
  roomName: String!
  matchId: ID!
  hostUserId: ID!
  status: RoomStatus!
  createdAt: AWSTimestamp!
}

type JoinRoomResult @aws_iam {
  roomId: ID!
  inviteCode: String!
  roomName: String!
  matchId: ID!
  status: RoomStatus!
  members: [RoomMember!]!
  joinedMember: RoomMember!
}

type RoomComment @aws_iam {
  roomId: ID!
  commentId: ID!
  promptId: ID!
  userId: ID!
  text: String!
  ts: AWSTimestamp!
}

type RoomLeaderboardEntry @aws_iam {
  userId: ID!
  displayName: String!
  coins: Int!
}

type RoomLeaderboardUpdate @aws_iam {
  roomId: ID!
  entries: [RoomLeaderboardEntry!]!
  updatedAt: AWSTimestamp!
}

# ─── Ranked mode + Titles (tier progression, lifetime accuracy) ──────────────

enum Tier {
  BRONZE
  SILVER
  GOLD
  DIAMOND
  CHAMPION
}

type Title @aws_iam {
  id: ID!
  name: String!
  description: String!
}

type RankedOpponent @aws_iam {
  opponentId: ID!
  opponentName: String!
  opponentTier: Tier!
  opponentTitle: String
}

type RankedMatchResult @aws_iam {
  matchId: ID!
  winnerId: ID!
  loserId: ID!
  winnerTier: Tier!
  winnerTierWins: Int!
  promoted: Boolean!
  newTier: Tier
}

type TierPromotedEvent @aws_iam {
  userId: ID!
  previousTier: Tier!
  newTier: Tier!
  ts: AWSTimestamp!
}

type TitleUnlockedEvent @aws_iam {
  userId: ID!
  titleId: ID!
  titleName: String!
  ts: AWSTimestamp!
}

# ─── Inputs ──────────────────────────────────────────────────────────────────

input MatchClockInput {
  matchId: ID!
  matchMinute: Float!
  displayClock: String!
  phase: String!
  scoreHome: Int!
  scoreGuest: Int!
  isRunning: Boolean!
  updatedAt: AWSTimestamp!
}

input MatchEventInput {
  matchId: ID!
  seq: Int!
  id: ID!
  type: String!
  matchMinute: Float!
  displayMinute: String!
  matchPhase: String!
  teamId: String
  playerId: String
  assistPlayerId: String
  cardColor: String
  reason: String
  scoreHome: Int
  scoreGuest: Int
  eventTimeIso: String
}

input FireReactionInput {
  roomId: ID!
  userId: ID!
  emoji: String!
}

input SubmitVoteInput {
  matchId: ID!
  promptId: ID!
  userId: ID!
  optionId: String!
  hotTake: Boolean
  rankedMode: Boolean
}

input SignalHotTakeInput {
  matchId: ID!
  promptId: ID!
  userId: ID!
  rivalUserId: ID!
}

input StartMatchInput {
  matchId: ID!
}

input CreateRoomInput {
  matchId: ID!
  userId: ID!
  displayName: String!
}

input JoinRoomInput {
  inviteCode: String!
  userId: ID!
  displayName: String!
}

input PostCommentInput {
  roomId: ID!
  promptId: ID!
  userId: ID!
  text: String!
}

input LeaveRoomInput {
  roomId: ID!
  userId: ID!
}

input RoomLeaderboardUpdateInput {
  roomId: ID!
  entries: [RoomLeaderboardEntryInput!]!
  updatedAt: AWSTimestamp!
}

input RoomLeaderboardEntryInput {
  userId: ID!
  displayName: String!
  coins: Int!
}

type StartMatchResult @aws_iam {
  matchId: ID!
  startedAtWallMs: AWSTimestamp!
  isRunning: Boolean!
}

# ─── Ranked matchday commitment (Gate E) ─────────────────────────────────────

type RankedMatchdayStatus @aws_iam {
  matchdayId: ID!
  lockedFixtureId: ID
  lockedFixtureLabel: String
  played: Boolean!
  matchPoints: Int
}

input LockInRankedInput {
  userId: ID!
  matchdayId: ID!
  fixtureId: ID!
  fixtureLabel: String!
}

# ─── Queries (minimal — used to bootstrap a late-joining client) ─────────────

enum LeaderboardPeriod {
  WEEKLY
  SEASONAL
}

type LeaderboardEntry @aws_iam {
  rank: Int!
  userId: ID!
  displayName: String!
  equippedTitle: String
  tier: Tier!
  points: Int!
}

type LeaderboardUpdate @aws_iam {
  period: LeaderboardPeriod!
  seasonNumber: Int
  isoWeek: String
  updatedAt: AWSTimestamp!
}

type UserStats @aws_iam {
  userId: ID!
  weeklyPoints: Int!
  weeklyRank: Int
  seasonalPoints: Int!
  seasonalRank: Int
  seasonNumber: Int!
  seasonEndsAt: String
  weeklyPointsResetAt: String
  tier: Tier!
  equippedTitleId: String
  equippedTitle: String
  unlockedTitles: [String!]
  tierWinsTowardNext: Int
  lifetimeAccuracy: Float
  rankedMatchesPlayed: Int
}

input LeaderboardUpdatedInput {
  period: LeaderboardPeriod!
  seasonNumber: Int
  isoWeek: String
  updatedAt: AWSTimestamp!
}

type Query @aws_iam {
  ping: String
  weeklyLeaderboard(limit: Int): [LeaderboardEntry!]!
  seasonalLeaderboard(seasonNumber: Int, limit: Int): [LeaderboardEntry!]!
  userStats(userId: String!): UserStats
  rankedMatchdayStatus(userId: ID!, matchdayId: ID!): RankedMatchdayStatus
}

# ─── Mutations ───────────────────────────────────────────────────────────────

type Mutation @aws_iam {
  startMatch(input: StartMatchInput!): StartMatchResult
  resetMatch(input: StartMatchInput!): StartMatchResult

  fireReaction(input: FireReactionInput!): RoomReaction

  submitVote(input: SubmitVoteInput!): Vote
  signalHotTake(input: SignalHotTakeInput!): HotTakeSignal
  initRankedHotTake(userId: ID!, matchId: ID!): Boolean

  publishMatchClock(input: MatchClockInput!): MatchClock

  publishMatchEvent(input: MatchEventInput!): MatchEvent

  # Watch Room — client-callable
  createRoom(input: CreateRoomInput!): CreateRoomResult
  joinRoom(input: JoinRoomInput!): JoinRoomResult
  postComment(input: PostCommentInput!): RoomComment
  leaveRoom(input: LeaveRoomInput!): Boolean

  # Watch Room — server-only broadcast (Gate E wiring)
  publishRoomLeaderboard(input: RoomLeaderboardUpdateInput!): RoomLeaderboardUpdate

  # Ranked + Titles — client-callable
  findRankedMatch(userId: ID!): RankedOpponent
  lockInRankedMatch(input: LockInRankedInput!): RankedMatchdayStatus
  equipTitle(userId: ID!, titleId: String!): Boolean
  unlockHotTakeHero(userId: ID!): Boolean

  # Ranked + Titles — server-only broadcast
  completeRankedMatch(
    matchId: ID!
    winnerId: ID!
    loserId: ID!
    winnerMatchPoints: Int!
    loserMatchPoints: Int!
  ): RankedMatchResult
  notifyTierPromoted(userId: ID!, previousTier: Tier!, newTier: Tier!, ts: AWSTimestamp!): TierPromotedEvent
  notifyTitleUnlocked(userId: ID!, titleId: ID!, titleName: String!, ts: AWSTimestamp!): TitleUnlockedEvent

  # Leaderboards — server-only broadcast (Gate B)
  publishLeaderboardUpdated(input: LeaderboardUpdatedInput!): LeaderboardUpdate
}

# ─── Subscriptions ───────────────────────────────────────────────────────────

type Subscription @aws_iam {
  matchClock(matchId: ID!): MatchClock
    @aws_subscribe(mutations: ["publishMatchClock"])

  matchEvent(matchId: ID!): MatchEvent
    @aws_subscribe(mutations: ["publishMatchEvent"])

  roomReaction(roomId: ID!): RoomReaction
    @aws_subscribe(mutations: ["fireReaction"])

  voteSubmitted(matchId: ID!): Vote
    @aws_subscribe(mutations: ["submitVote"])

  roomMemberJoined(roomId: ID!): JoinRoomResult
    @aws_subscribe(mutations: ["joinRoom"])

  roomComment(promptId: ID!, roomId: ID!): RoomComment
    @aws_subscribe(mutations: ["postComment"])

  roomLeaderboardUpdate(roomId: ID!): RoomLeaderboardUpdate
    @aws_subscribe(mutations: ["publishRoomLeaderboard"])

  tierPromoted(userId: ID!): TierPromotedEvent
    @aws_subscribe(mutations: ["notifyTierPromoted"])

  titleUnlocked(userId: ID!): TitleUnlockedEvent
    @aws_subscribe(mutations: ["notifyTitleUnlocked"])

  rivalHotTakeSignal(rivalUserId: ID!): HotTakeSignal
    @aws_subscribe(mutations: ["signalHotTake"])

  leaderboardUpdated(period: LeaderboardPeriod!): LeaderboardUpdate
    @aws_subscribe(mutations: ["publishLeaderboardUpdated"])
}
