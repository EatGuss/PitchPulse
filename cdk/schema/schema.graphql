# PitchPulse — AppSync GraphQL schema
#
# Real-time multiplayer pipeline. Mutations are the broadcast points; matching
# subscriptions fan out via @aws_subscribe over pure WebSockets (Amplify SDK
# default). Auth: IAM via Cognito Identity Pool (unauthenticated role) for the
# client; server-side Lambdas use their execution role's IAM credentials.

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ─── Match clock + events (Pillar 2: real-time data) ─────────────────────────

type MatchClock @aws_iam {
  matchId: ID!
  matchMinute: Float!
  displayClock: String!
  phase: String!
  scoreHome: Int!
  scoreGuest: Int!
  isRunning: Boolean!
  updatedAt: AWSTimestamp!
}

type MatchEvent @aws_iam {
  matchId: ID!
  seq: Int!
  id: ID!
  type: String!
  matchMinute: Float!
  displayMinute: String!
  matchPhase: String!
  teamId: String
  playerId: String
  assistPlayerId: String
  cardColor: String
  reason: String
  scoreHome: Int
  scoreGuest: Int
  eventTimeIso: String
}

# ─── Watch room reactions (Pillar 1: multiplayer) ────────────────────────────

type RoomReaction @aws_iam {
  roomId: ID!
  reactionId: ID!
  userId: ID!
  emoji: String!
  ts: AWSTimestamp!
}

# ─── Vote + prompt broadcast (gamification persistence — Tier B in Gate 4) ───

type Vote @aws_iam {
  matchId: ID!
  promptId: ID!
  userId: ID!
  optionId: String!
  votedAt: AWSTimestamp!
}

# ─── Watch Room (private friend-group matchday) ──────────────────────────────

enum RoomStatus {
  WAITING
  ACTIVE
  ENDED
}

type RoomMember @aws_iam {
  userId: ID!
  displayName: String!
  joinedAt: AWSTimestamp!
}

type CreateRoomResult @aws_iam {
  roomId: ID!
  inviteCode: String!
  roomName: String!
  matchId: ID!
  hostUserId: ID!
  status: RoomStatus!
  createdAt: AWSTimestamp!
}

type JoinRoomResult @aws_iam {
  roomId: ID!
  inviteCode: String!
  roomName: String!
  matchId: ID!
  status: RoomStatus!
  members: [RoomMember!]!
  joinedMember: RoomMember!
}

type RoomComment @aws_iam {
  roomId: ID!
  commentId: ID!
  promptId: ID!
  userId: ID!
  text: String!
  ts: AWSTimestamp!
}

type RoomLeaderboardEntry @aws_iam {
  userId: ID!
  displayName: String!
  coins: Int!
}

type RoomLeaderboardUpdate @aws_iam {
  roomId: ID!
  entries: [RoomLeaderboardEntry!]!
  updatedAt: AWSTimestamp!
}

# ─── Inputs ──────────────────────────────────────────────────────────────────

input MatchClockInput {
  matchId: ID!
  matchMinute: Float!
  displayClock: String!
  phase: String!
  scoreHome: Int!
  scoreGuest: Int!
  isRunning: Boolean!
  updatedAt: AWSTimestamp!
}

input MatchEventInput {
  matchId: ID!
  seq: Int!
  id: ID!
  type: String!
  matchMinute: Float!
  displayMinute: String!
  matchPhase: String!
  teamId: String
  playerId: String
  assistPlayerId: String
  cardColor: String
  reason: String
  scoreHome: Int
  scoreGuest: Int
  eventTimeIso: String
}

input FireReactionInput {
  roomId: ID!
  userId: ID!
  emoji: String!
}

input SubmitVoteInput {
  matchId: ID!
  promptId: ID!
  userId: ID!
  optionId: String!
}

input StartMatchInput {
  matchId: ID!
}

input CreateRoomInput {
  matchId: ID!
  userId: ID!
  displayName: String!
}

input JoinRoomInput {
  inviteCode: String!
  userId: ID!
  displayName: String!
}

input PostCommentInput {
  roomId: ID!
  promptId: ID!
  userId: ID!
  text: String!
}

input LeaveRoomInput {
  roomId: ID!
  userId: ID!
}

input RoomLeaderboardUpdateInput {
  roomId: ID!
  entries: [RoomLeaderboardEntryInput!]!
  updatedAt: AWSTimestamp!
}

input RoomLeaderboardEntryInput {
  userId: ID!
  displayName: String!
  coins: Int!
}

type StartMatchResult @aws_iam {
  matchId: ID!
  startedAtWallMs: AWSTimestamp!
  isRunning: Boolean!
}

# ─── Queries (minimal — used to bootstrap a late-joining client) ─────────────

type Query @aws_iam {
  ping: String
}

# ─── Mutations ───────────────────────────────────────────────────────────────

type Mutation @aws_iam {
  startMatch(input: StartMatchInput!): StartMatchResult

  fireReaction(input: FireReactionInput!): RoomReaction

  submitVote(input: SubmitVoteInput!): Vote

  publishMatchClock(input: MatchClockInput!): MatchClock

  publishMatchEvent(input: MatchEventInput!): MatchEvent

  # Watch Room — client-callable
  createRoom(input: CreateRoomInput!): CreateRoomResult
  joinRoom(input: JoinRoomInput!): JoinRoomResult
  postComment(input: PostCommentInput!): RoomComment
  leaveRoom(input: LeaveRoomInput!): Boolean

  # Watch Room — server-only broadcast (Gate E wiring)
  publishRoomLeaderboard(input: RoomLeaderboardUpdateInput!): RoomLeaderboardUpdate
}

# ─── Subscriptions ───────────────────────────────────────────────────────────

type Subscription @aws_iam {
  matchClock(matchId: ID!): MatchClock
    @aws_subscribe(mutations: ["publishMatchClock"])

  matchEvent(matchId: ID!): MatchEvent
    @aws_subscribe(mutations: ["publishMatchEvent"])

  roomReaction(roomId: ID!): RoomReaction
    @aws_subscribe(mutations: ["fireReaction"])

  voteSubmitted(matchId: ID!): Vote
    @aws_subscribe(mutations: ["submitVote"])

  roomMemberJoined(roomId: ID!): JoinRoomResult
    @aws_subscribe(mutations: ["joinRoom"])

  roomComment(promptId: ID!, roomId: ID!): RoomComment
    @aws_subscribe(mutations: ["postComment"])

  roomLeaderboardUpdate(roomId: ID!): RoomLeaderboardUpdate
    @aws_subscribe(mutations: ["publishRoomLeaderboard"])
}
